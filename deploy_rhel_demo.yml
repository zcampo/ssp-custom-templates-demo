---
- name: Deploy RHEL demo
  hosts: localhost
  connection: local
  tasks:
    - name: Debug all vars
      ansible.builtin.debug:
        msg:
          cpu: "{{ cpu | default('NOT_RECEIVED') }}"
          memory: "{{ memory | default('NOT_RECEIVED') }}"
          add_disks: "{{ add_disks | default('NOT_RECEIVED') }}"
          enabled: "{{ enabled | default('NOT_RECEIVED') }}"
          group: "{{ group | default('NOT_RECEIVED') }}"
          email: "{{ email | default('NOT_RECEIVED') }}"
          group_num: "{{ group_num | default('NOT_RECEIVED') }}"
          chg_bypass: "{{ chg_bypass | default('NOT_RECEIVED') }}"
          chg_bypass_just: "{{ chg_bypass_just | default('NOT_RECEIVED') }}"
          chg_number: "{{ chg_number | default('NOT_RECEIVED') }}"
          vcenter: "{{ vcenter | default('NOT_RECEIVED') }}"
          cluster: "{{ cluster | default('NOT_RECEIVED') }}"
          vm_folder: "{{ vm_folder | default('NOT_RECEIVED') }}"
