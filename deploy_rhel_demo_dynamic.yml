apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: linux-deployment-ssp-demo-dynamic
  title: 🐧 Linux Deployment SSP Demo
  description: >-
    Linux Deployment SSP Demo
  namespace: default
  tags:
    - linux
    - custom
spec:
  type: service
  presentation:
    buttonLabels:
      backButtonText: 'Return'
      createButtonText: 'Update'
      reviewButtonText: 'Verify'
  parameters:
    - title: Hardware
      required:
        - cpu
        - memory
      properties:
        cpu:
          title: CPU
          type: integer
          default: 2
          description: |
            CPU
        memory:
          title: Memory (GB)
          type: integer
          default: 4
          description: |
            Memory (GB)
        add_disks:
          title: Additional Disks
          type: array
          description: Add one or more additional disks.
          minItems: 0
          items:
            type: object
            required:
              - disk_name
              - disk_size
            properties:
              disk_name:
                title: Disk Name
                type: string
                description: Enter the disk name.
              disk_size:
                title: Disk Size (GB)
                type: integer
                minimum: 1
                description: Enter disk size in GB.
          ui:options:
            addable: true
            orderable: true
            removable: true

    - title: Deployment
      required:
        - enabled
        - group
        - email
        - group_num
      properties:
        enabled:
          title: Deployments Enabled
          type: boolean
          default: true
        group:
          title: Group
          type: string
          default: Group1
          enum:
            - Group1
            - Group2
            - Group3
        email:
          title: Email Address
          type: array
          minItems: 1
          description: Please enter one or more valid corporate email addresses.
          items:
            type: string
            format: email
            minLength: 5
            maxLength: 100
          ui:options:
            addableText: "Add another email"
            orderable: false
        group_num:
          title: Group Number
          type: string
        chg_bypass:
          title: Bypass Change Creation?
          type: boolean
          default: false
      dependencies:
        chg_bypass:
          oneOf:
            - if:
                properties:
                  chg_bypass:
                    const: true
              then:
                # This injects the field into the UI only if chg_bypass is true
                properties:
                  chg_bypass_just:
                    title: Bypass Change Creation Justification
                    type: string
                    description: Please provide a business justification for bypassing the change process.
                  chg_number:
                    title: Existing Change Number
                    type: string
                    description: |
                      If no valid "Existing CHG" exists, please supply 'CHG00000000'.
                required:
                  - chg_bypass_just
                  - chg_number
    - title: Placement Information
      description: |
        Please configure where to place this deployment.
      required:
        - vcenter
        - cluster
        - vm_folder
      properties:
        vcenter:
          title: vCenter
          type: string
          enum:
            - vcenter1
            - vcenter2
          default: vcenter1
        cluster:
          title: Cluster
          type: string
        vm_folder:
          title: VM Folder
          type: string
      dependencies:
        vcenter:
          allOf:
            - if:
                properties:
                  vcenter:
                    const: vcenter1
              then:
                properties:
                  cluster:
                    type: string
                    title: Cluster
                    enum:
                      - Cluster1a
                      - Cluster1b
                  vm_folder:
                    type: string
                    title: VM Folder
                    enum:
                      - VM Folder 1a
                      - VM Folder 1b
                      - VM Folder 1c
            - if:
                properties:
                  vcenter:
                    const: vcenter2
              then:
                properties:
                  cluster:
                    type: string
                    title: Cluster
                    enum:
                      - Cluster2a
                      - Cluster2b
                  vm_folder:
                    type: string
                    title: VM Folder
                    enum:
                      - VM Folder 2a
                      - VM Folder 2b
                      - VM Folder 2c
                      
    - title: Review & Confirm
      properties:
        review:
          type: string
          title: 📝 Review Your Choices
          description: |
            Please review your selections before continuing.
            After you click Next, your settings will be applied.
          default: "If everything looks correct, click Next to start the process."
  steps:
    
    - id: review
      name: Review Selections
      action: debug:log
      input:
        message: |
          ========================================
             LINUX DEPLOYMENT - CONFIGURATION
          ========================================

          HARDWARE
          ----------------------------------------
          CPU:                 ${{ parameters.cpu }}
          Memory:              ${{ parameters.memory }} GB
          {% if parameters.add_disks and parameters.add_disks | length > 0 %}
          Additional Disks:
          {% for disk in parameters.add_disks %}
            - {{ disk.disk_name }} ({{ disk.disk_size }} GB)
          {% endfor %}
          {% else %}
          Additional Disks:    None
          {% endif %}

          DEPLOYMENT
          ----------------------------------------
          Enabled:             ${{ 'Yes' if parameters.enabled else 'No' }}
          Group:               ${{ parameters.group }}
          Group Number:        ${{ parameters.group_num }}

          Email Addresses:
          {% for mail in parameters.email %}
            - {{ mail }}
          {% endfor %}

          CHANGE MANAGEMENT
          ----------------------------------------
          Bypass Change:       ${{ 'Yes' if parameters.chg_bypass else 'No' }}
          {% if parameters.chg_bypass %}
          Justification:       ${{ parameters.chg_bypass_just }}
          Change Number:       ${{ parameters.chg_number }}
          {% else %}
          Justification:       N/A
          Change Number:       N/A
          {% endif %}

          PLACEMENT
          ----------------------------------------
          vCenter:             ${{ parameters.vcenter }}
          Cluster:             ${{ parameters.cluster }}
          VM Folder:           ${{ parameters.vm_folder }}

          ========================================
                  END OF CONFIGURATION
          ========================================
          
    - id: launch-job
      name: run Linux Deployment SSP Demo
      action: rhaap:launch-job-template
      input:
        token: ${{ parameters.token }}
        values:
          template: Linux Deployment SSP Demo
          extraVariables:
            cpu: ${{ parameters.cpu }}
            memory: ${{ parameters.memory }}
            add_disks: ${{ parameters.add_disks if parameters.add_disks and parameters.add_disks | length > 0 else omit }}
            enabled: ${{ parameters.enabled }}
            group: ${{ parameters.group }}
            email: ${{ parameters.email }}
            group_num: ${{ parameters.group_num }}
            chg_bypass: ${{ parameters.chg_bypass if parameters.chg_bypass is defined else omit }}
            chg_bypass_just: ${{ parameters.chg_bypass_just if parameters.chg_bypass_just else omit }}
            chg_number: ${{ parameters.chg_number if parameters.chg_number else omit }}
            vcenter: ${{ parameters.vcenter }}
            cluster: ${{ parameters.cluster }}
            vm_folder: ${{ parameters.vm_folder }}
            
  output:
    text:
      - title: Linux Deployment - Job Complete!
        content: |
          ## Deployment Results
  
          **Job ID:** ${{ steps['launch-job'].output.data.id }}
          **Status:** ${{ steps['launch-job'].output.data.status }}
  
          [View AAP Job Details](${{ steps['launch-job'].output.data.url }})
  
          ---
  
          ## Hardware
  
          - CPU: ${{ parameters.cpu }}
          - Memory: ${{ parameters.memory }} GB
  
          **Additional Disks:**
          ${{ parameters.add_disks | dump }}
  
          ## Deployment
  
          - Enabled: ${{ parameters.enabled }}
          - Group: ${{ parameters.group }}
          - Group Number: ${{ parameters.group_num }}
  
          **Email Addresses:**
          ${{ parameters.email | dump }}
  
          ## Change Management
  
          - Bypass Change: ${{ parameters.chg_bypass }}
  
          {% if parameters.chg_bypass %}
          - Justification: ${{ parameters.chg_bypass_just }}
          - Change Number: ${{ parameters.chg_number }}
          {% endif %}
  
          ## Placement
  
          - vCenter: ${{ parameters.vcenter }}
          - Cluster: ${{ parameters.cluster }}
          - VM Folder: ${{ parameters.vm_folder }}
  
          ---
          Thank you for using Linux Deployment SSP Demo!
