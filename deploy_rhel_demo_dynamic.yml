apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: linux-deployment-ssp-demo-dynamic
  title: 🐧 Linux Deployment SSP Demo
  description: >-
    Linux Deployment SSP Demo
  namespace: default
  tags:
    - linux
    - custom
spec:
  type: service
  presentation:
    buttonLabels:
      backButtonText: 'Return'
      createButtonText: 'Update'
      reviewButtonText: 'Verify'
  parameters:
    - title: Hardware
      required:
        - cpu
        - memory
      properties:
        cpu:
          title: CPU
          type: integer
          default: 2
          description: |
            CPU
        memory:
          title: Memory (GB)
          type: integer
          default: 4
          description: |
            Memory (GB)
        add_disks:
          title: Additional Disks
          type: string
    - title: Deployment
      required:
        - enabled
        - group
        - email
        - group_num
        - vcenter
        - cluster
        - vm_folder
      properties:
        enabled:
          title: Deployments Enabled
          type: boolean
          default: true
        group:
          title: Group
          type: string
          default: Group1
          enum:
            - Group1
            - Group2
            - Group3
        email:
          title: Email Address
          type: array
          minItems: 1
          description: Please enter one or more valid corporate email addresses.
          items:
            type: string
            format: email
            minLength: 5
            maxLength: 100
          ui:options:
            addableText: "Add another email"
            orderable: false
        group_num:
          title: Group Number
          type: string
        chg_bypass:
          title: Bypass Change Creation?
          type: boolean
          default: false
        chg_bypass_just:
          type: string
        chg_number:
          type: string
          
        placementSubheader:
          type: string
          description: |
            ### Placement Info
            Please configure where to place this deployment in the fields below.
          ui:field: DescriptionFieldTemplate # Hides the text input box completely

        vcenter:
          title: vCenter
          type: string
        cluster:
          title: Cluster
          type: string
        vm_folder:
          title: VM Folder
          type: string
      dependencies:
        chg_bypass:
          allOf:
            - if:
                properties:
                  chg_bypass:
                    const: true
              then:
                # This injects the field into the UI only if chg_bypass is true
                properties:
                  chg_bypass_just:
                    title: Bypass Change Creation Justification
                    type: string
                    description: Please provide a business justification for bypassing the change process.
                  chg_number:
                    title: Existing Change Number
                    type: string
                    description: |
                      If no valid "Existing CHG" exists, please supply 'CHG00000000'.
                required:
                  - chg_bypass_just
                  - chg_number
    - title: Review & Confirm
      properties:
        review:
          type: string
          title: 📝 Review Your Choices
          description: |
            Please review your selections before continuing.
            After you click Update, your settings will be applied.
          default: "If everything looks correct, click Update to start the process."
  steps:
    - id: review
      name: Review Selections
      action: debug:log
      input:
        message: |
          Review Hardware Details:
          --------------------------
          CPU: ${{ parameters.cpu }}
          Memory (GB): ${{ parameters.memory }}
          {% if parameters.add_disks %}
          Additional Disks: ${{ parameters.add_disks }}
          {% endif %}

          Review Deployment Details:
          --------------------------
          Deployments Enabled: ${{ 'Yes' if parameters.enabled else 'No' }}
          Group: ${{ parameters.group }}

          {% if parameters.email %}
          Email Addresses:
          {% for mail in parameters.email %}
          - ${{ mail }}
          {% endfor %}
          {% endif %}

          Group Number: ${{ parameters.group_num }}

          Bypass Change Creation: ${{ 'Yes' if parameters.chg_bypass else 'No' }}

          {% if parameters.chg_bypass %}
          Bypass Justification: ${{ parameters.chg_bypass_just }}
          Change Number: ${{ parameters.chg_number }}
          {% endif %}

          Placement Details:
          --------------------------
          vCenter: ${{ parameters.vcenter }}
          Cluster: ${{ parameters.cluster }}
          VM Folder: ${{ parameters.vm_folder }}
          
    - id: launch-job
      name: run Linux Deployment SSP Demo
      action: rhaap:launch-job-template
      input:
        token: ${{ parameters.token }}
        values:
          template: Linux Deployment SSP Demo
          extraVariables:
            cpu: ${{ parameters.cpu if parameters.cpu else omit }}
            memory: ${{ parameters.memory if parameters.memory else omit }}
            add_disks: ${{ parameters.add_disks if (parameters.add_disks and parameters.add_disks | length > 0) else omit }}
            enabled: ${{ parameters.enabled if parameters.enabled is defined else omit }}
            group: ${{ parameters.group if parameters.group else omit }}
            email: ${{ parameters.email if (parameters.email and parameters.email | length > 0) else omit }}
            group_num: ${{ parameters.group_num if parameters.group_num else omit }}
            chg_bypass: ${{ parameters.chg_bypass if parameters.chg_bypass is defined else omit }}
            chg_bypass_just: ${{ parameters.chg_bypass_just if parameters.chg_bypass_just else omit }}
            chg_number: ${{ parameters.chg_number if parameters.chg_number else omit }}
            vcenter: ${{ parameters.vcenter if parameters.vcenter else omit }}
            cluster: ${{ parameters.cluster if parameters.cluster else omit }}
            vm_folder: ${{ parameters.vm_folder if parameters.vm_folder else omit }}
            
  output:
    text:
      - title: Job Complete!
        content: |
          **Job ID:** ${{ steps['launch-job'].output.data.id }}
          **Status:** ${{ steps['launch-job'].output.data.status }}

          [View Details](${{ steps['launch-job'].output.data.url }})

          ---
          Thank you for using this form!
