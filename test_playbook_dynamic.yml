apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ssp-vars-demo-dynamic
  title: SSP VARS DEMO DYNAMIC
  description: >-
    Change the variables conditionally
  namespace: default
  tags:
    - testing
spec:
  type: service
  presentation:
    buttonLabels:
      backButtonText: 'Return'
      createButtonText: 'Update'
      reviewButtonText: 'Verify'
  parameters:
    - title: Person Vars!
      required:
        - var1
        - var2
        - var3
      properties:
        var1:
          title: 🔑 var1
          type: string
          description: |
            Who are we talking about?
        var2:
          title: 🗂️ var2
          type: string
          default: is
        var3:
          type: string
      dependencies:
        var1:
          oneOf:
            # Condition A: If var1 is Zach, var3 can only be "cool"
            - properties:
                var1:
                  const: Zach
                var3:
                  title: 🔐 var3
                  type: string
                  enum: [cool]
                  description: |
                    What is the person?
            # Condition B: If var1 is anything else, var3 can be typed freely or choose another enum
            - properties:
                var1:
                  not:
                    const: Zach
                var3:
                  title: 🔐 var3
                  type: string
                  description: |
                    What is the person?
    - title: Place Vars!
      required:
        - var4
        - var5
        - var6
      properties:
        var4:
          title: 🔑 var4
          type: string
          description: |
            Where are we talking about?
        var5:
          title: 🗂️ var5
          type: string
          default: is
        var6:
          type: string
      dependencies:
        var4:
          oneOf:
            # Condition A: If var4 is NA, var6 can only be "cool"
            - properties:
                var4:
                  const: NA
                var6:
                  title: 🔐 var6
                  type: string
                  enum: [cool]
                  description: |
                    What is the place?
            # Condition B: If var4 is anything else, var6 can be typed freely or choose another enum
            - properties:
                var4:
                  not:
                    const:  NA
                var6:
                  title: 🔐 var6
                  type: string
                  description: |
                    What is the place?
    - title: Review & Confirm
      properties:
        review:
          type: string
          title: 📝 Review Your Choices
          description: |
            Please review your selections before continuing.
            After you click Update, your settings will be applied.
          default: "If everything looks correct, click Update to start the process."
  steps:
    - id: review
      name: Review Selections
      action: debug:log
      input:
        message: |
          Review
          var1: ${{ parameters.var1 }}
          var2: ${{ parameters.var2 }}
          var3: ${{ parameters.var3 }}
          
    - id: launch-job
      name: run SSP VARS DEMO
      action: rhaap:launch-job-template
      input:
        token: ${{ parameters.token }}
        values:
          template: SSP VARS DEMO
          extraVariables:
            var1: ${{ parameters.var1 }}
            var2: ${{ parameters.var2 }}
            var3: ${{ parameters.var3 }}
            
  output:
    text:
      - title: Job Complete!
        content: |
          **Job ID:** ${{ steps['launch-job'].output.data.id }}
          **Status:** ${{ steps['launch-job'].output.data.status }}

          [View Details](${{ steps['launch-job'].output.data.url }})

          ---
          Thank you for using this form!
